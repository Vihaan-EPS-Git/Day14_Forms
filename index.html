<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Truths and a Lie</title>
</head>

<body style="background-color:beige">
    <h1>Vihaan's Two Truths and a Lie Game</h1>
    <hr>

    <h2>Introductions (Do this First!)</h2>
    <form action="" id="name-form">
        <label for="fname">First Name:</label><br />
        <input type="text" name="fname" id="fname"><br />
        <label for="lname">Last Name:</label><br />
        <input type="text" name="lname" id="lname"><br />
        <label for="age">Age:</label><br />
        <input type="number" name="age" id="age"><br />
    </form>
    <br />
    <input type="button" value="SUBMIT" onclick="greet();">
    <p id="greet" style="font-size: x-large;">Welcome!</p>

    <h2>Warm Up Trivia Question:</h2>
    <p>What is the only food that cannot go bad?</p>
    <p id="trivia1-answer"></p>

    <form action="">
        <input type="radio" name="trivia1" value="a" id="chocolate">
        <label for="chocolate">Dark Chocolate</label><br />
        <input type="radio" name="trivia1" value="a" id="tuna">
        <label for="tuna">Tuna</label><br />
        <input type="radio" name="trivia1" value="a" id="honey">
        <label for="honey">Honey</label><br />
    </form>
    <br />
    <input type="button" value="SUBMIT" onclick="trivia1();">
    <p id="trivia1-result"></p>

    <form action="">
        <h2>Two Truths and a Lie</h2>
        <p>Please select the statement you believe is the lie:</p>

        <input type="radio" name="truths" value="1" id="truth1">
        <label for="truth1">I have a pet dragon.</label><br />
        <input type="radio" name="truths" value="2" id="truth2">
        <label for="truth2">I have been to 10 different countries.</label><br />
        <input type="radio" name="truths" value="3" id="truth3">
        <label for="truth3">I can speak 1 language fluently.</label><br />
    </form>
    <br />
    <input type="button" value="SUBMIT" onclick="truths();">

    <p id="truths-result"></p>

    <script src="javascript/truth.js"></script>
</body>

</html>
